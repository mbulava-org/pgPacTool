name: Publish Stable Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Only stable tags: v1.0.0, v1.1.0, etc. (no preview suffix)
  workflow_dispatch:
    inputs:
      version:
        description: 'Full stable version override (e.g., 1.0.0)'
        required: false
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release
  PACKAGES_DIR: ./packages

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run ProjectExtract-Tests
      id: projectextract_tests
      continue-on-error: true
      run: |
        dotnet test tests/ProjectExtract-Tests/ProjectExtract-Tests.csproj \
          --configuration ${{ env.CONFIGURATION }} --no-build \
          --filter "Category!=LinuxContainer" \
          --verbosity normal --logger "trx;LogFileName=test-results-projectextract.trx"

    - name: Run mbulava.PostgreSql.Dac.Tests
      id: dac_tests
      continue-on-error: true
      run: |
        dotnet test tests/mbulava.PostgreSql.Dac.Tests/mbulava.PostgreSql.Dac.Tests.csproj \
          --configuration ${{ env.CONFIGURATION }} --no-build \
          --filter "Category!=LinuxContainer" \
          --verbosity normal --logger "trx;LogFileName=test-results-dac.trx"

    - name: Run NpgqueryExtended.Tests
      id: npgquery_tests
      continue-on-error: true
      run: |
        dotnet test tests/NpgqueryExtended.Tests/NpgqueryExtended.Tests.csproj \
          --configuration ${{ env.CONFIGURATION }} --no-build \
          --verbosity normal --logger "trx;LogFileName=test-results-npgquery.trx"

    - name: Run NugetPackage.Tests
      id: nugetpackage_tests
      continue-on-error: true
      run: |
        dotnet test tests/NugetPackage.Tests/NugetPackage.Tests.csproj \
          --configuration ${{ env.CONFIGURATION }} --no-build \
          --verbosity normal --logger "trx;LogFileName=test-results-nugetpackage.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/*.trx'
        retention-days: 30

    - name: Fail if tests failed
      if: |
        steps.projectextract_tests.outcome == 'failure' ||
        steps.dac_tests.outcome == 'failure' ||
        steps.npgquery_tests.outcome == 'failure' ||
        steps.nugetpackage_tests.outcome == 'failure'
      run: |
        echo "One or more test suites failed."
        echo "ProjectExtract-Tests: ${{ steps.projectextract_tests.outcome }}"
        echo "Dac.Tests: ${{ steps.dac_tests.outcome }}"
        echo "NpgqueryExtended.Tests: ${{ steps.npgquery_tests.outcome }}"
        echo "NugetPackage.Tests: ${{ steps.nugetpackage_tests.outcome }}"
        exit 1

  pack-and-publish:
    name: Pack and Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: write  # For creating releases
      packages: write  # For publishing packages

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Extract version
      id: get_version
      shell: pwsh
      run: |
        if ("${{ github.event.inputs.version }}" -ne "") {
          $version = "${{ github.event.inputs.version }}"
          Write-Host "Using manual version: $version"
        } elseif ("${{ github.ref_type }}" -eq "tag") {
          # Strip leading 'v' from tag name
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Using version from tag: $version"
        } else {
          $csprojPath = "src/libs/mbulava.PostgreSql.Dac/mbulava.PostgreSql.Dac.csproj"
          [xml]$csproj = Get-Content $csprojPath
          $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          Write-Host "Extracted version from .csproj: $version"
        }

        # Must be a stable version (no pre-release suffix)
        if ($version -notmatch '^\d+\.\d+\.\d+$') {
          Write-Error "publish-stable.yml requires a stable version (e.g., 1.0.0). Got: $version"
          exit 1
        }

        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG_NAME=v$version" >> $env:GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Create packages directory
      run: New-Item -ItemType Directory -Path ${{ env.PACKAGES_DIR }} -Force
      shell: pwsh

    - name: Pack mbulava.PostgreSql.Dac
      run: |
        dotnet pack src/libs/mbulava.PostgreSql.Dac/mbulava.PostgreSql.Dac.csproj `
          --configuration ${{ env.CONFIGURATION }} `
          --output ${{ env.PACKAGES_DIR }} `
          --no-restore `
          /p:Version=${{ steps.get_version.outputs.VERSION }}
      shell: pwsh

    - name: Pack MSBuild.Sdk.PostgreSql
      run: |
        dotnet pack src/sdk/MSBuild.Sdk.PostgreSql/MSBuild.Sdk.PostgreSql.csproj `
          --configuration ${{ env.CONFIGURATION }} `
          --output ${{ env.PACKAGES_DIR }} `
          --no-restore `
          /p:Version=${{ steps.get_version.outputs.VERSION }}
      shell: pwsh

    - name: Pack postgresPacTools
      run: |
        dotnet pack src/postgresPacTools/postgresPacTools.csproj `
          --configuration ${{ env.CONFIGURATION }} `
          --output ${{ env.PACKAGES_DIR }} `
          --no-restore `
          /p:Version=${{ steps.get_version.outputs.VERSION }}
      shell: pwsh

    - name: Verify package contents
      shell: pwsh
      run: |
        Write-Host "📦 Packages created:" -ForegroundColor Cyan
        Get-ChildItem ${{ env.PACKAGES_DIR }} -Filter *.nupkg | ForEach-Object {
          $size = [math]::Round($_.Length / 1KB, 2)
          Write-Host "  • $($_.Name) ($size KB)" -ForegroundColor White
        }

        $dacPackage = Get-ChildItem ${{ env.PACKAGES_DIR }} -Filter "mbulava.PostgreSql.Dac*.nupkg" | Select-Object -First 1
        if ($dacPackage) {
          Write-Host "`n🔍 Verifying Npgquery embedding..." -ForegroundColor Yellow
          $tempDir = if ($IsLinux -or $IsMacOS) { "/tmp/verify-$(Get-Random)" } else { Join-Path $env:TEMP "verify-$(Get-Random)" }
          Expand-Archive -Path $dacPackage.FullName -DestinationPath $tempDir -Force

          $hasNpgquery = Test-Path "$tempDir/lib/net10.0/Npgquery.dll"
          $nativeFiles = Get-ChildItem "$tempDir/runtimes" -Recurse -Include "*pg_query*" -ErrorAction SilentlyContinue

          if ($hasNpgquery) {
            Write-Host "✅ Npgquery.dll is embedded" -ForegroundColor Green
          } else {
            Write-Error "❌ Npgquery.dll not found in package!"
            exit 1
          }

          if ($nativeFiles.Count -gt 0) {
            Write-Host "✅ Native libraries included ($($nativeFiles.Count) files)" -ForegroundColor Green
          } else {
            Write-Error "❌ Native libraries not found!"
            exit 1
          }

          Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ${{ env.PACKAGES_DIR }}/*.nupkg
        retention-days: 90

    - name: Publish to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ("$env:NUGET_API_KEY" -eq "") {
          Write-Warning "⚠️ NUGET_API_KEY secret not set - skipping NuGet publish"
          Write-Host "To publish to NuGet.org, add NUGET_API_KEY secret to repository settings"
          exit 0
        }

        Write-Host "📤 Publishing packages to NuGet.org..." -ForegroundColor Cyan

        Get-ChildItem ${{ env.PACKAGES_DIR }} -Filter *.nupkg | ForEach-Object {
          Write-Host "Publishing $($_.Name)..." -ForegroundColor Yellow
          dotnet nuget push $_.FullName `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY `
            --skip-duplicate

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Published $($_.Name)" -ForegroundColor Green
          } else {
            Write-Error "❌ Failed to publish $($_.Name)"
            exit 1
          }
        }

        Write-Host "`n✅ All packages published successfully!" -ForegroundColor Green
      shell: pwsh

    - name: Extract changelog for release notes
      id: changelog
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"
        $content = Get-Content CHANGELOG.md -Raw
        # Extract section between ## [1.0.0] and next ## [
        if ($content -match "(?s)## \[$version\][^\n]*\n(.+?)(?=\n## \[|\z)") {
          $notes = $Matches[1].Trim()
        } else {
          $notes = "See CHANGELOG.md for details."
        }
        # Write to file to avoid multiline env var issues
        $notes | Set-Content /tmp/release-notes.md
        Write-Host "Release notes extracted successfully"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
        name: pgPacTool ${{ steps.get_version.outputs.TAG_NAME }}
        body_path: /tmp/release-notes.md
        files: ${{ env.PACKAGES_DIR }}/*.nupkg
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: pack-and-publish
    if: always()

    steps:
    - name: Summary
      run: |
        echo "# 🎉 Publish Stable Workflow Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Status" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.pack-and-publish.result }}" == "success" ]; then
          echo "✅ **SUCCESS** - Packages published to NuGet.org" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **FAILED** - Check workflow logs for details" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Resources" >> $GITHUB_STEP_SUMMARY
        echo "- [NuGet.org packages](https://www.nuget.org/profiles/mbulava-org)" >> $GITHUB_STEP_SUMMARY
        echo "- [GitHub Releases](https://github.com/mbulava-org/pgPacTool/releases)" >> $GITHUB_STEP_SUMMARY
        echo "- Install CLI: \`dotnet tool install --global postgresPacTools\`" >> $GITHUB_STEP_SUMMARY
