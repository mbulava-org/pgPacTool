name: Publish Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0 | 1.0.0.1 | 1.0.0-Preview1 | 1.0.0.1-Preview1)'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release
  PACKAGES_DIR: ./packages

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Validate branch
      shell: pwsh
      run: |
        $branch = "${{ github.ref_name }}"
        if ($branch -ne "main" -and $branch -ne "preview") {
          Write-Error "This workflow may only be run on the 'main' or 'preview' branches. Current branch: $branch"
          exit 1
        }
        Write-Host "Branch check passed: $branch"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore /p:Version=${{ github.event.inputs.version }}

    - name: Run ProjectExtract-Tests
      id: projectextract_tests
      continue-on-error: true
      run: |
        dotnet test tests/ProjectExtract-Tests/ProjectExtract-Tests.csproj \
          --configuration ${{ env.CONFIGURATION }} --no-build \
          --filter "Category!=LinuxContainer" \
          --verbosity normal --logger "trx;LogFileName=test-results-projectextract.trx"

    - name: Run mbulava.PostgreSql.Dac.Tests
      id: dac_tests
      continue-on-error: true
      run: |
        dotnet test tests/mbulava.PostgreSql.Dac.Tests/mbulava.PostgreSql.Dac.Tests.csproj \
          --configuration ${{ env.CONFIGURATION }} --no-build \
          --filter "Category!=LinuxContainer" \
          --verbosity normal --logger "trx;LogFileName=test-results-dac.trx"

    - name: Run NpgqueryExtended.Tests
      id: npgquery_tests
      continue-on-error: true
      run: |
        # Issue #37 resolved: NpgqueryExtended.Tests now runs stably on Linux.
        # The fix uses NativeLibraryCleanupFixture (ClearDelegateCache on teardown)
        # and disables test parallelisation (xunit.runner.json). Protobuf tests that
        # crash on Linux are individually skipped via [Skip] attributes (Issue #36).
        dotnet test tests/NpgqueryExtended.Tests/NpgqueryExtended.Tests.csproj \
          --configuration ${{ env.CONFIGURATION }} --no-build \
          --verbosity normal --logger "trx;LogFileName=test-results-npgquery.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/*.trx'
        retention-days: 30

    - name: Fail if tests failed
      if: steps.projectextract_tests.outcome == 'failure' || steps.dac_tests.outcome == 'failure' || steps.npgquery_tests.outcome == 'failure'
      run: |
        echo "One or more test suites failed."
        echo "ProjectExtract-Tests: ${{ steps.projectextract_tests.outcome }}"
        echo "Dac.Tests: ${{ steps.dac_tests.outcome }}"
        echo "NpgqueryExtended.Tests: ${{ steps.npgquery_tests.outcome }}"
        exit 1

  pack-and-publish:
    name: Pack and Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: write  # For creating releases and tagging
      packages: write  # For publishing packages

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Validate and apply version tag
      id: get_version
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version }}"

        # Validate version format: #.#.#, #.#.#.#, #.#.#-Preview#, #.#.#.#-Preview#
        if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?(-[Pp]review\d+)?$') {
          Write-Error "Invalid version format: '$version'. Must be one of: #.#.#  #.#.#.#  #.#.#-Preview#  #.#.#.#-Preview#"
          exit 1
        }

        $tagName = "v$version"

        # Ensure tag does not already exist
        $existingTag = git tag --list $tagName
        if ($existingTag) {
          Write-Error "Tag '$tagName' already exists. Choose a different version."
          exit 1
        }

        # Ensure the new version is greater than the last existing tag
        $allTags = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+' } | Sort-Object {
          $parts = ($_ -replace '^v', '') -split '[-.]'
          # Pad each numeric segment to 10 chars for lexicographic comparison; preview suffix sorts lower
          $numeric = @($parts[0].PadLeft(10,'0'), ($parts[1]+'').PadLeft(10,'0'), ($parts[2]+'').PadLeft(10,'0'))
          $fourth  = if ($parts.Count -ge 4 -and $parts[3] -match '^\d+$') { $parts[3].PadLeft(10,'0') } else { '0000000000' }
          # If there is a pre-release suffix, sort it lower than the release
          $pre     = if ($_ -match '-') { '0' } else { '1' }
          "$($numeric[0]).$($numeric[1]).$($numeric[2]).$fourth.$pre"
        }

        $lastTag = $allTags | Select-Object -Last 1
        if ($lastTag) {
          Write-Host "Last existing tag: $lastTag"

          # Compare semver numerically
          function Parse-Version($v) {
            $v = $v -replace '^v', ''
            $pre = ''
            if ($v -match '^(.*?)-(.+)$') { $v = $Matches[1]; $pre = $Matches[2] }
            $parts = $v -split '\.'
            @{
              Major = [int]$parts[0]
              Minor = [int]$parts[1]
              Patch = [int]$parts[2]
              Build = if ($parts.Count -ge 4) { [int]$parts[3] } else { -1 }
              Pre   = $pre
            }
          }

          $newV  = Parse-Version $tagName
          $lastV = Parse-Version $lastTag

          function Compare-Versions($a, $b) {
            if ($a.Major -ne $b.Major) { return $a.Major - $b.Major }
            if ($a.Minor -ne $b.Minor) { return $a.Minor - $b.Minor }
            if ($a.Patch -ne $b.Patch) { return $a.Patch - $b.Patch }
            $aBuild = if ($a.Build -ge 0) { $a.Build } else { 0 }
            $bBuild = if ($b.Build -ge 0) { $b.Build } else { 0 }
            if ($aBuild -ne $bBuild) { return $aBuild - $bBuild }
            # Release (empty pre) > pre-release
            if ($a.Pre -eq '' -and $b.Pre -ne '') { return 1 }
            if ($a.Pre -ne '' -and $b.Pre -eq '') { return -1 }
            return [string]::Compare($a.Pre, $b.Pre, $true)
          }

          if ((Compare-Versions $newV $lastV) -le 0) {
            Write-Error "Version '$version' must be greater than the last tag '$lastTag'."
            exit 1
          }
        } else {
          Write-Host "No existing version tags found; proceeding with first tag."
        }

        # Apply the tag to the current commit
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag $tagName
        git push origin $tagName
        Write-Host "Tag '$tagName' applied and pushed."

        echo "VERSION=$version"   >> $env:GITHUB_OUTPUT
        echo "TAG_NAME=$tagName"  >> $env:GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore /p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Create packages directory
      run: New-Item -ItemType Directory -Path ${{ env.PACKAGES_DIR }} -Force
      shell: pwsh

    - name: Pack mbulava.PostgreSql.Dac
      run: |
        dotnet pack src/libs/mbulava.PostgreSql.Dac/mbulava.PostgreSql.Dac.csproj `
          --configuration ${{ env.CONFIGURATION }} `
          --output ${{ env.PACKAGES_DIR }} `
          --no-restore `
          /p:Version=${{ steps.get_version.outputs.VERSION }}
      shell: pwsh

    - name: Pack MSBuild.Sdk.PostgreSql
      run: |
        dotnet pack src/sdk/MSBuild.Sdk.PostgreSql/MSBuild.Sdk.PostgreSql.csproj `
          --configuration ${{ env.CONFIGURATION }} `
          --output ${{ env.PACKAGES_DIR }} `
          --no-restore `
          /p:Version=${{ steps.get_version.outputs.VERSION }}
      shell: pwsh

    - name: Pack postgresPacTools
      run: |
        dotnet pack src/postgresPacTools/postgresPacTools.csproj `
          --configuration ${{ env.CONFIGURATION }} `
          --output ${{ env.PACKAGES_DIR }} `
          --no-restore `
          /p:Version=${{ steps.get_version.outputs.VERSION }}
      shell: pwsh

    - name: Pack pgprojBuilder
      run: |
        dotnet pack src/pgprojBuilder/pgprojBuilder.csproj `
          --configuration ${{ env.CONFIGURATION }} `
          --output ${{ env.PACKAGES_DIR }} `
          --no-restore `
          /p:Version=${{ steps.get_version.outputs.VERSION }}
      shell: pwsh
    
    - name: Verify package contents
      shell: pwsh
      run: |
        Write-Host "📦 Packages created:" -ForegroundColor Cyan
        Get-ChildItem ${{ env.PACKAGES_DIR }} -Filter *.nupkg | ForEach-Object {
          $size = [math]::Round($_.Length / 1KB, 2)
          Write-Host "  • $($_.Name) ($size KB)" -ForegroundColor White
        }

        # Verify Npgquery embedding in main package
        $dacPackage = Get-ChildItem ${{ env.PACKAGES_DIR }} -Filter "mbulava.PostgreSql.Dac*.nupkg" | Select-Object -First 1
        if ($dacPackage) {
          Write-Host "`n🔍 Verifying Npgquery embedding..." -ForegroundColor Yellow
          $tempDir = if ($IsLinux -or $IsMacOS) { "/tmp/verify-$(Get-Random)" } else { Join-Path $env:TEMP "verify-$(Get-Random)" }
          Expand-Archive -Path $dacPackage.FullName -DestinationPath $tempDir -Force

          $hasNpgquery = Test-Path "$tempDir/lib/net10.0/Npgquery.dll"
          $nativeFiles = Get-ChildItem "$tempDir/runtimes" -Recurse -Include "*pg_query*" -ErrorAction SilentlyContinue

          if ($hasNpgquery) {
            Write-Host "✅ Npgquery.dll is embedded" -ForegroundColor Green
          } else {
            Write-Error "❌ Npgquery.dll not found in package!"
            exit 1
          }

          if ($nativeFiles.Count -gt 0) {
            Write-Host "✅ Native libraries included ($($nativeFiles.Count) files)" -ForegroundColor Green
          } else {
            Write-Error "❌ Native libraries not found!"
            exit 1
          }

          Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ${{ env.PACKAGES_DIR }}/*.nupkg
        retention-days: 90

    - name: Publish to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ("$env:NUGET_API_KEY" -eq "") {
          Write-Warning "⚠️ NUGET_API_KEY secret not set - skipping NuGet publish"
          Write-Host "To publish to NuGet.org, add NUGET_API_KEY secret to repository settings"
          exit 0
        }

        Write-Host "📤 Publishing packages to NuGet.org..." -ForegroundColor Cyan

        Get-ChildItem ${{ env.PACKAGES_DIR }} -Filter *.nupkg | ForEach-Object {
          Write-Host "Publishing $($_.Name)..." -ForegroundColor Yellow
          dotnet nuget push $_.FullName `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY `
            --skip-duplicate

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Published $($_.Name)" -ForegroundColor Green
          } else {
            Write-Error "❌ Failed to publish $($_.Name)"
            exit 1
          }
        }

        Write-Host "`n✅ All packages published successfully!" -ForegroundColor Green
      shell: pwsh
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
        name: pgPacTool ${{ steps.get_version.outputs.TAG_NAME }}
        body: |
          # pgPacTool ${{ steps.get_version.outputs.VERSION }}

          ## 🚀 Release

          ## 📦 NuGet Packages

          - **mbulava.PostgreSql.Dac** - Core library for PostgreSQL database-as-code
          - **MSBuild.Sdk.PostgreSql** - MSBuild SDK for database projects
          - **postgresPacTools** - CLI global tool (`pgpac` command)
          - **pgprojBuilder** - PostgreSQL project builder tooling

          ## 📥 Installation

          ### CLI Tool
          ```bash
          dotnet tool install --global postgresPacTools --version ${{ steps.get_version.outputs.VERSION }}
          pgpac --version
          ```

          ### Library
          ```bash
          dotnet add package mbulava.PostgreSql.Dac --version ${{ steps.get_version.outputs.VERSION }}
          ```

          ### MSBuild SDK
          ```xml
          <Project Sdk="MSBuild.Sdk.PostgreSql/${{ steps.get_version.outputs.VERSION }}">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
          </Project>
          ```

          ## 📝 Changelog

          See [CHANGELOG.md](https://github.com/mbulava-org/pgPacTool/blob/main/CHANGELOG.md) for detailed changes.

          ## 🐛 Feedback

          Please report issues at https://github.com/mbulava-org/pgPacTool/issues
        files: ${{ env.PACKAGES_DIR }}/*.nupkg
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'review') }}
        make_latest: ${{ !contains(steps.get_version.outputs.VERSION, 'review') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: pack-and-publish
    if: always()

    steps:
    - name: Summary
      run: |
        echo "# 🎉 Publish Stable Workflow Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Status" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.pack-and-publish.result }}" == "success" ]; then
          echo "✅ **SUCCESS** - Packages published to NuGet.org" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **FAILED** - Check workflow logs for details" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Verify packages on [NuGet.org](https://www.nuget.org/profiles/mbulava-org)" >> $GITHUB_STEP_SUMMARY
        echo "- Check [GitHub Releases](https://github.com/mbulava-org/pgPacTool/releases)" >> $GITHUB_STEP_SUMMARY
        echo "- Test installation: \`dotnet tool install --global postgresPacTools\`" >> $GITHUB_STEP_SUMMARY
